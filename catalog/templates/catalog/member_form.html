{% extends "catalog/base.html" %}
{% block title %}Register member · Library Manager{% endblock %}
{% block content %}
<section class="page-heading"><p class="eyebrow">READERS</p><h1>Register a member</h1><p>Enter the member's contact information.</p></section>
<section class="form-panel">
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="button" type="submit">Save member</button>
    <a class="text-link" href="{% url 'member_list' %}">Cancel</a>
</form>
</section>
{% endblock %}
