{% extends "catalog/base.html" %}

{% block title %}Issue Book · Athena Library Manager{% endblock %}

{% block content %}
<section class="page-heading">
    <p class="eyebrow">CIRCULATION DESK</p>
    <h1>Issue a Book</h1>
    <p>Select an in-stock book title, borrower member, and return deadline.</p>
</section>

<section class="form-panel">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div style="margin-top: 24px; display: flex; align-items: center; gap: 14px;">
            <button class="button" type="submit">Confirm &amp; Issue Book</button>
            <a class="text-link" href="{% url 'loan_list' %}">Cancel & Return</a>
        </div>
    </form>
</section>
{% endblock %}
