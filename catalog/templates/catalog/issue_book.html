{% extends "catalog/base.html" %}
{% block title %}Issue a book · Library Manager{% endblock %}
{% block content %}
<section class="page-heading"><p class="eyebrow">LOANS</p><h1>Issue a book</h1><p>Select a book with available stock, a member and a due date.</p></section>
<section class="form-panel">
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="button" type="submit">Confirm issue</button>
    <a class="text-link" href="{% url 'loan_list' %}">Cancel</a>
</form>
</section>
{% endblock %}
