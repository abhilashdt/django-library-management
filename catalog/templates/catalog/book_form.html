{% extends "catalog/base.html" %}
{% block title %}Add book · Library Manager{% endblock %}
{% block content %}
<section class="page-heading"><p class="eyebrow">CATALOGUE</p><h1>Add a book</h1><p>Enter the book details and copy counts.</p></section>
<section class="form-panel">
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="button" type="submit">Save book</button>
    <a class="text-link" href="{% url 'book_list' %}">Cancel</a>
</form>
</section>
{% endblock %}
