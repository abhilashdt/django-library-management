{% extends "catalog/base.html" %}

{% block title %}Add New Book · Athena Library Manager{% endblock %}

{% block content %}
<section class="page-heading">
    <p class="eyebrow">CATALOGUE REGISTRATION</p>
    <h1>Add a New Book</h1>
    <p>Enter the bibliographic metadata and inventory stock quantity.</p>
</section>

<section class="form-panel">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div style="margin-top: 24px; display: flex; align-items: center; gap: 14px;">
            <button class="button" type="submit">Save Book Record</button>
            <a class="text-link" href="{% url 'book_list' %}">Cancel & Return</a>
        </div>
    </form>
</section>
{% endblock %}
