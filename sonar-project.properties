# SonarQube / SonarCloud project configuration
sonar.projectKey=django-library-management
sonar.projectName=Django Library Management System
sonar.projectVersion=1.0

# Optional SonarCloud organization (uncomment and set if using SonarCloud)
sonar.organization=abhilashdt

# Source code and test locations
sonar.sources=catalog,demoproj
sonar.tests=catalog
sonar.test.inclusions=catalog/tests.py,catalog/**/test*.py
sonar.exclusions=**/migrations/**,manage.py,**/wsgi.py,**/asgi.py,staticfiles/**,.platform/**,.ebextensions/**

# Python runtime and coverage report
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml

# Character encoding
sonar.sourceEncoding=UTF-8
